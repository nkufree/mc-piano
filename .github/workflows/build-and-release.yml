name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Locate distributable JAR
        id: jar
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'mc-piano-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_path"
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Upload test JAR
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: mc-piano-test-${{ github.sha }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release and upload JAR
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
